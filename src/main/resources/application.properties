spring.application.name=studentapp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/studentapp_db}
spring.datasource.username=${DB_USER:dani}
spring.datasource.password=${DB_PASSWORD:skilos2005}
spring.datasource.driver-class-name=org.postgresql.Driver

# Σε καθε εκκινηση: δημιουργουνται οι πινακες που λειπουν και τα δοκιμαστικα δεδομενα που λειπουν.
# Δεν διαγραφεται τιποτα, οποτε τα δεδομενα των χρηστων διατηρουνται.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

spring.thymeleaf.cache=false

server.port=8080

# Το session αναγνωριζεται μονο απο cookie (οχι ;jsessionid=... μεσα στα URL)
server.servlet.session.tracking-modes=cookie

# Το session ληγει μετα απο 30 λεπτα χωρις δραστηριοτητα
server.servlet.session.timeout=30m
