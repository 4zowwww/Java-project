spring.application.name=studentapp

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/studentapp_db}
spring.datasource.username=${DB_USER:dani}
spring.datasource.password=${DB_PASSWORD:skilos2005}
spring.datasource.driver-class-name=org.postgresql.Driver

# Σε κάθε εκκίνηση: δημιουργούνται οι πίνακες που λείπουν και τα δοκιμαστικά δεδομένα που λείπουν.
# Δεν διαγράφεται τίποτα, οπότε τα δεδομένα των χρηστών διατηρούνται.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

spring.thymeleaf.cache=false

server.port=8080

# Το session αναγνωρίζεται μόνο από cookie (όχι ;jsessionid=... μέσα στα URL)
server.servlet.session.tracking-modes=cookie

# Το session λήγει μετά από 30 λεπτά χωρίς δραστηριότητα
server.servlet.session.timeout=30m
